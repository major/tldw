# Deployment notes:
# - The tldw-data PVC is REQUIRED. An emptyDir loses the SQLite queue on a
#   reschedule, and because the hub does not redeliver after a 200 response,
#   those videos would be silently dropped.
# - replicas MUST stay at 1. The worker drains the queue serially and that
#   serial design is the rate-limit defense for YouTube: a second pod would
#   double-probe the same videos. SQLite over a network filesystem is also
#   unsafe. Scale CPU and memory, not replicas.
# - Supply TLDW_DISCORD_WEBHOOK_URL from a Secret in production rather than a
#   plain value here, so the webhook URL is not exposed in the pod spec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tldw
  labels:
    app: tldw
spec:
  replicas: 1
  # Recreate is required so a rolling update does not briefly run two
  # workers against the same SQLite queue. The serial worker is the
  # rate-limit defense for YouTube (replicas: 1 is also enforced above).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tldw
  template:
    metadata:
      labels:
        app: tldw
      # Surface the running build with `kubectl get pods -L git-sha`. Update
      # these labels from your CI/CD when you cut a new release.
      annotations:
        tldw.mhtx.net/git-sha: "{{ .git_sha }}"
        tldw.mhtx.net/build-time: "{{ .build_time }}"
    spec:
      containers:
        - name: tldw
          image: ghcr.io/example/tldw:{{ .image_tag }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # The Containerfile already sets these from build args, but
            # overriding them here makes the values visible in
            # `kubectl describe pod` and `kubectl get pod -o yaml` without
            # having to pull the image manifest.
            - name: TLDW_GIT_SHA
              value: "{{ .git_sha }}"
            - name: TLDW_BUILD_TIME
              value: "{{ .build_time }}"
            # Persistent storage paths. Both live under the mounted /data
            # volume backed by the tldw-data PVC.
            - name: TLDW_QUEUE_FILE
              value: /data/queue.sqlite3
            - name: TLDW_TRANSCRIPT_DIR
              value: /data/transcripts
            # Set from a Secret in production. Left empty here so a cluster
            # without the Secret still starts. With no webhook the transcript
            # worker does not run at all, so nothing is downloaded or sent; the
            # notifications are still enqueued for a later restart.
            - name: TLDW_DISCORD_WEBHOOK_URL
              value: ""
            # LLM takeaway settings. The API key must come from a Secret in
            # production so it is not exposed in the pod spec. The base URL
            # and model default to public OpenAI when unset, so they are
            # hard-coded here for visibility.
            - name: TLDW_OPENAI_API_KEY
              value: ""
            - name: TLDW_OPENAI_BASE_URL
              value: "https://api.openai.com/v1"
            - name: TLDW_OPENAI_MODEL
              value: "gpt-6.1-sol"
            - name: TLDW_POLL_BASE_SECONDS
              value: "600"
            - name: TLDW_POLL_CAP_SECONDS
              value: "3600"
            - name: TLDW_GIVEUP_SECONDS
              value: "172800"
            - name: TLDW_TRANSCRIPT_LINES
              value: "10"
          volumeMounts:
            - name: tldw-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /version
              port: http
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: tldw-data
          persistentVolumeClaim:
            claimName: tldw-data
