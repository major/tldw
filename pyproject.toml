[project]
name = "tldw"
version = "0.1.0"
description = "TL;DW: Too Long; Didn't Watch"
readme = "README.md"
authors = [
    { name = "Major Hayden", email = "major@mhtx.net" }
]
requires-python = ">=3.14"
dependencies = [
    "curl_cffi>=0.13,<1",
    "fastapi>=0.110,<1",
    "httpx2>=2.13.1,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn>=0.30,<1",
    "yt-dlp[default]>=2026.8.19,<2027",
]

[project.scripts]
tldw = "tldw.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=tldw",
    "--cov-branch",
    "--cov-report=term-missing",
    "--disable-socket",
    # asyncio creates a self pipe with socket.socketpair() when it builds an
    # event loop. Without this flag pytest-socket blocks that call and every
    # async test fails during setup, before the test body runs. AF_UNIX only.
    # Real TCP and DNS stay blocked, so tests still cannot reach the network.
    "--allow-unix-socket",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["tldw"]
